name: Deploy Production

# Every push (or merged PR) on `main` deploys the Worker to production (url.devslix.com)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at the same time, and never cancel one half-way
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://url.devslix.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SERVER_URL: https://url.devslix.com
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYLOAD_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret '$name' is not set"
              exit 1
            fi
          done

      # Runs Payload migrations against the PRODUCTION D1 database (top-level binding in wrangler.jsonc)
      - name: Migrate production D1
        run: pnpm run deploy:database

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg s "$PAYLOAD_SECRET" '{PAYLOAD_SECRET: $s}' > "$secrets_file"
          pnpm exec opennextjs-cloudflare deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
