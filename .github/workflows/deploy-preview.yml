name: Deploy Preview

# Every push to any branch except `main` creates/updates a Worker Preview for that branch.
# Previews use the PREVIEW D1 + R2 (the "previews" block in wrangler.jsonc), never production.
# Docs: https://developers.cloudflare.com/workers/previews/
on:
  push:
    branches-ignore: [main]
  # When a branch is deleted (e.g. after merging), its Preview is deleted too
  delete:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_NAME: short-url

jobs:
  preview:
    name: Deploy Worker Preview
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Newer pushes to the same branch replace an in-progress preview deploy.
    concurrency:
      group: preview-${{ github.ref_name }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PREVIEW_PAYLOAD_SECRET }}
      # Points the Payload CLI + build at the PREVIEW D1/R2 instead of production
      PAYLOAD_WRANGLER_CONFIG: wrangler.preview-migrations.jsonc
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYLOAD_SECRET; do
            if [ -z "${!name}" ]; then
              [ "$name" = "PAYLOAD_SECRET" ] && name="PREVIEW_PAYLOAD_SECRET"
              echo "::error::GitHub secret '$name' is not set"
              exit 1
            fi
          done

      # Preview names may only contain lowercase letters, digits and dashes, must start with a
      # letter, and "<name>-short-url" must fit in a 63 character DNS label.
      - name: Compute preview name and URL
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          max=$(( 63 - ${#WORKER_NAME} - 1 ))
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          [[ "$name" =~ ^[a-z] ]] || name="b-$name"
          name=$(printf '%s' "${name:0:$max}" | sed -E 's/-+$//')

          response=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          subdomain=$(printf '%s' "$response" | jq -r '.result.subdomain // empty')
          if [ -z "$subdomain" ]; then
            echo "::error::Could not read the account's workers.dev subdomain from the Cloudflare API"
            printf '%s' "$response" | jq '{success, errors, messages}' || printf '%s\n' "$response"
            # Diagnostics (never prints the secret values themselves)
            echo "--- secret format checks ---"
            echo "token length: ${#CLOUDFLARE_API_TOKEN}"
            [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]] && echo "token contains whitespace/newline: YES (remove it)" || echo "token contains whitespace/newline: no"
            [[ "$CLOUDFLARE_API_TOKEN" == Bearer* || "$CLOUDFLARE_API_TOKEN" == bearer* ]] && echo "token starts with 'Bearer': YES (remove it)" || echo "token starts with 'Bearer': no"
            echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID} (expected 32)"
            [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] && echo "account id format: ok" || echo "account id format: INVALID (must be 32 lowercase hex chars, no spaces)"
            echo "--- user token verify ---"
            curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -c '{success, errors, status: .result.status}' || true
            echo "--- account token verify (for account-owned tokens) ---"
            curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -c '{success, errors, status: .result.status}' || true
            exit 1
          fi

          url="https://${name}-${WORKER_NAME}.${subdomain}.workers.dev"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Next.js inlines NEXT_PUBLIC_* at build time
          echo "NEXT_PUBLIC_SERVER_URL=$url" >> "$GITHUB_ENV"
          echo "Preview name: $name"
          echo "Preview URL:  $url"

      # Runs Payload migrations against the PREVIEW D1 database
      - name: Migrate preview D1
        run: pnpm run deploy:preview:database

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Preview
        id: preview
        env:
          PREVIEW_NAME: ${{ steps.meta.outputs.name }}
          EXPECTED_URL: ${{ steps.meta.outputs.url }}
        run: |
          set -o pipefail
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg s "$PAYLOAD_SECRET" '{PAYLOAD_SECRET: $s}' > "$secrets_file"
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json \
            --secrets-file "$secrets_file" \
            --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}")"
          rm -f "$secrets_file"
          printf '%s\n' "$output"

          url="$(printf '%s' "$output" | jq -r '.preview.urls[0] // empty')"
          if [ -z "$url" ]; then
            echo "::warning::Wrangler did not return a Preview URL. Enable 'Preview' under Worker URL on the Worker's Domains tab in the Cloudflare dashboard."
            url="$EXPECTED_URL"
          elif [ "${url%/}" != "$EXPECTED_URL" ]; then
            echo "::warning::Preview URL ($url) differs from the URL used at build time ($EXPECTED_URL)."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 Preview deployed"
            echo ""
            echo "| Branch | Preview URL |"
            echo "| --- | --- |"
            echo "| \`$GITHUB_REF_NAME\` | $url |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete Worker Preview
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Compute preview name
        id: meta
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          max=$(( 63 - ${#WORKER_NAME} - 1 ))
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          [[ "$name" =~ ^[a-z] ]] || name="b-$name"
          name=$(printf '%s' "${name:0:$max}" | sed -E 's/-+$//')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Delete Preview
        run: |
          npx --yes wrangler@4.166.0 preview delete \
            --worker-name "$WORKER_NAME" \
            --name "${{ steps.meta.outputs.name }}" \
            --skip-confirmation || echo "::warning::Preview not found or already deleted"
